<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
  <title id="title">Skill Tree 共用後端與跨模組整合狀態</title>
  <desc id="description">A、B 模組使用共用 Express API；C 的測驗建立與取題 routes 已接入共用 app，答案提交、結算尚待接入；D XP worker 尚待接入。Express 連到 PostgreSQL migrations 001 到 010。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#52756A" />
    </marker>
    <marker id="pending-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#B77A2D" />
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans CJK TC", sans-serif; fill: #18342d; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #527067; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #527067; }
      .card-title { font-size: 20px; font-weight: 700; }
      .card-copy { font-size: 14px; fill: #36574e; }
      .small { font-size: 12px; fill: #527067; }
      .card { fill: #f4f8f5; stroke: #c9d9d0; stroke-width: 2; }
      .api { fill: #e8f4ee; stroke: #86b29b; stroke-width: 2; }
      .pending { fill: #fff8ec; stroke: #d6ad70; stroke-width: 2; stroke-dasharray: 8 6; }
      .database { fill: #edf2ff; stroke: #9baed6; stroke-width: 2; }
      .implemented-line { stroke: #52756A; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .pending-line { stroke: #B77A2D; stroke-width: 3; stroke-dasharray: 9 7; fill: none; marker-end: url(#pending-arrow); }
    </style>
  </defs>
  <rect width="1440" height="820" rx="24" fill="#ffffff" />
  <text x="56" y="66" class="title">Skill Tree 共用後端</text>
  <text x="56" y="96" class="subtitle">已具備的服務與仍待跨模組驗收的界線</text>

  <text x="56" y="151" class="section">應用模組</text>
  <text x="544" y="151" class="section">共用 Express API / backend services</text>
  <text x="1084" y="151" class="section">PostgreSQL</text>

  <rect x="56" y="180" width="400" height="106" rx="16" class="card" />
  <text x="80" y="216" class="card-title">A · 會員與個人資料</text>
  <text x="80" y="245" class="card-copy">登入、Session、profile、onboarding 已接共用 API</text>
  <text x="80" y="268" class="small">共用會員 session 由伺服器驗證</text>

  <rect x="56" y="310" width="400" height="106" rx="16" class="card" />
  <text x="80" y="346" class="card-title">B · 技能目錄與進度畫面</text>
  <text x="80" y="375" class="card-copy">目錄、會員進度、學習歷史 API 已提供</text>
  <text x="80" y="398" class="small">B 畫面串接與正式目錄資料仍待驗收</text>

  <rect x="56" y="440" width="400" height="106" rx="16" class="api" />
  <text x="80" y="476" class="card-title">C · 測驗流程</text>
  <text x="80" y="505" class="card-copy">建立／取題 routes 已接共用 API</text>
  <text x="80" y="528" class="small">作答、結算與測驗歷史 routes 待完成</text>

  <rect x="56" y="570" width="400" height="106" rx="16" class="pending" />
  <text x="80" y="606" class="card-title">D · XP 與遊戲化</text>
  <text x="80" y="635" class="card-copy">XP worker、入帳規則與畫面串接尚待接入</text>
  <text x="80" y="658" class="small">Outbox schema 和首通 enqueue 服務已建立</text>

  <rect x="520" y="180" width="500" height="496" rx="20" class="api" />
  <text x="552" y="222" class="card-title">共用 API 邊界</text>
  <text x="552" y="254" class="card-copy">Session · 權限 middleware · request ID</text>
  <text x="552" y="280" class="card-copy">Success / error envelope · 欄位驗證 · CORS</text>
  <line x1="552" y1="305" x2="988" y2="305" stroke="#c6ddd0" stroke-width="2" />
  <text x="552" y="340" class="section">已提供的 HTTP API</text>
  <text x="552" y="373" class="card-copy">/api/auth/* · /api/me · /api/admin/*</text>
  <text x="552" y="401" class="card-copy">GET /api/skills · GET /api/progress/history</text>
  <text x="552" y="429" class="card-copy">POST /api/quizzes/attempts · GET attempt</text>
  <line x1="552" y1="454" x2="988" y2="454" stroke="#c6ddd0" stroke-width="2" />
  <text x="552" y="490" class="section">Backend-only services</text>
  <text x="552" y="523" class="card-copy">正式題庫查詢 · recordSkillCompletion()</text>
  <text x="552" y="551" class="card-copy">enqueueSkillFirstPassXpEvent()</text>
  <rect x="552" y="578" width="436" height="66" rx="12" fill="#ffffff" stroke="#d7e5dd" />
  <text x="572" y="606" class="small">API Explorer 和唯讀工作台僅在開發環境提供</text>
  <text x="572" y="628" class="small">建題／取題已接；仍待 B/C/D 端對端驗收</text>

  <rect x="1080" y="180" width="304" height="496" rx="20" class="database" />
  <text x="1112" y="222" class="card-title">PostgreSQL</text>
  <text x="1112" y="252" class="card-copy">本機基線：17</text>
  <text x="1112" y="277" class="small">團隊 major version 仍待確認</text>
  <line x1="1112" y1="302" x2="1352" y2="302" stroke="#d2dbef" stroke-width="2" />
  <text x="1112" y="338" class="section">MIGRATIONS 001–010</text>
  <text x="1112" y="373" class="card-copy">users / sessions</text>
  <text x="1112" y="403" class="card-copy">skills / questions</text>
  <text x="1112" y="433" class="card-copy">quiz_attempts / snapshots</text>
  <text x="1112" y="463" class="card-copy">completions / revisions</text>
  <text x="1112" y="493" class="card-copy">learning history view</text>
  <text x="1112" y="523" class="card-copy">XP outbox / ledger</text>
  <rect x="1112" y="558" width="240" height="84" rx="12" fill="#ffffff" stroke="#d2dbef" />
  <text x="1132" y="588" class="small">history 是唯讀 view</text>
  <text x="1132" y="612" class="small">XP 發放 worker 尚未完成</text>

  <path d="M456 232H520" class="implemented-line" />
  <path d="M456 362H520" class="implemented-line" />
  <path d="M456 492H520" class="implemented-line" />
  <path d="M456 622H520" class="pending-line" />
  <path d="M1020 428H1080" class="implemented-line" />
  <path d="M1020 610H1080" class="pending-line" />

  <line x1="56" y1="730" x2="108" y2="730" class="implemented-line" />
  <text x="124" y="735" class="small">已實作的共用能力</text>
  <line x1="312" y1="730" x2="364" y2="730" class="pending-line" />
  <text x="380" y="735" class="small">待跨模組接線與驗收</text>
  <text x="1384" y="735" text-anchor="end" class="small">E-07 僅在 B/C/D 真實流程驗收後完成</text>
</svg>
