  <path d="M214 96l6-7 6 7h-4v6h-4v-6z" fill="#EBCB72"/>
  <!-- 標語 -->
  <text x="28" y="146" fill="#F2F4ED" font-size="12" font-weight="700">今天學一點，</text>
  <text x="28" y="164" fill="#F2F4ED" font-size="12" font-weight="700">明天的你會更強！</text>
