<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
  <!-- 等級示意：皇冠＋等級＋升級進度環，參考設計稿上方的「目前等級」「學習進度」統計 -->
  <rect width="320" height="180" fill="#171C16"/>
  <!-- 皇冠 -->
  <circle cx="92" cy="86" r="46" fill="#EBCB72" opacity="0.08"/>
  <path d="M64 104 58 68l18 14 16-24 16 24 18-14-6 36z" fill="#EBCB72"/>
  <rect x="64" y="108" width="56" height="8" rx="2" fill="#EBCB72"/>
  <circle cx="92" cy="58" r="4" fill="#EBCB72"/>
  <text x="92" y="146" text-anchor="middle" fill="#A6AE9D" font-size="11">目前等級</text>
  <!-- 等級 -->
  <text x="148" y="82" fill="#EBCB72" font-size="30" font-weight="800">Lv. 3</text>
  <text x="148" y="104" fill="#A6AE9D" font-size="11">累積 XP 自動升級</text>
  <text x="148" y="126" fill="#F2F4ED" font-size="11" font-weight="700">距離 Lv. 4</text>
  <rect x="148" y="134" width="84" height="6" rx="3" fill="#30392C"/>
  <rect x="148" y="134" width="42" height="6" rx="3" fill="#C6F36A"/>
  <!-- 進度環 50% -->
  <circle cx="268" cy="120" r="22" fill="none" stroke="#30392C" stroke-width="6"/>
  <circle cx="268" cy="120" r="22" fill="none" stroke="#C6F36A" stroke-width="6" stroke-linecap="round" stroke-dasharray="69.1 138.2" transform="rotate(-90 268 120)"/>
  <text x="268" y="124" text-anchor="middle" fill="#F2F4ED" font-size="11" font-weight="800">50%</text>
</svg>
